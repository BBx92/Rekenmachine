<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekenmachine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="rekenmachine">
    <div class="display" id="display">0</div>
    <div class="toetsen">
      <button class="breed-3" data-actie="wissen">C</button>
      <button class="operator" data-operator="/">÷</button>
      <button data-cijfer="7">7</button>
      <button data-cijfer="8">8</button>
      <button data-cijfer="9">9</button>
      <button class="operator" data-operator="*">×</button>
      <button data-cijfer="4">4</button>
      <button data-cijfer="5">5</button>
      <button data-cijfer="6">6</button>
      <button class="operator" data-operator="-">−</button>
      <button data-cijfer="1">1</button>
      <button data-cijfer="2">2</button>
      <button data-cijfer="3">3</button>
      <button class="operator" data-operator="+">+</button>
      <button class="breed-2" data-cijfer="0">0</button>
      <button data-actie="komma">,</button>
      <button class="operator" data-actie="is">=</button>
    </div>
  </main>
</body>
</html>
